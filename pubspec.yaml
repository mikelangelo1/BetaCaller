name: beta_caller
description: A VoIP calling app similar to Yolla and AlphaCaller
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9

  # State Management
  provider: ^6.1.1
  get: ^4.6.6

  # VoIP & Calling
  permission_handler: ^11.1.0
  flutter_phone_direct_caller: ^2.1.1
  telnyx_webrtc: ^0.1.0
  flutter_webrtc: ^0.12.12+hotfix.1

  # Contacts
  contacts_service: ^0.6.3
  flutter_contacts: ^1.1.7

  # Network & API
  http: ^1.1.2
  dio: ^5.4.0

  # Payment Gateways
  pay_with_paystack: ^1.0.14
  flutter_stripe: ^12.1.1

  # Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1

  # Authentication
  crypto: ^3.0.3
  jwt_decoder: ^2.0.1
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.0.0

  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.2.2
  country_code_picker: ^3.0.0
  flutter_native_timezone: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
